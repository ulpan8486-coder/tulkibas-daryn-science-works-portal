# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tulkibas-daryn-science-works
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "echo 'no build step'"
    startCommand: node server.js
    healthCheckPath: /api/me
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_EMAIL
        value: admin@td.kz
      # Render asks for these values when the Blueprint is created (not stored in git)
      - key: ADMIN_PASSWORD
        sync: false
      # Postgres connection string (e.g. a free Neon database) — keeps data across restarts
      - key: DATABASE_URL
        sync: false
